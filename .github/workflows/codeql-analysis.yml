name: CodeQL

on:
  push:
    branches: [dev, release]
  pull_request:
    branches: [dev]
  schedule:
    - cron: "0 12 * * 4"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
