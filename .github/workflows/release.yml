name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - name: Build release archive
        run: bash scripts/release.sh
      - name: Publish GitHub release
        run: gh release create "$GITHUB_REF_NAME" release/Authenticator-*.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
